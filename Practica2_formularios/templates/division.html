<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta charset="viewport" content="width=device=width, initial-scale=1.0">
    <title>Division</title>

    <link rel="stylesheet"
        href="{{url_for('static', filename='css/estilos.css')}}">

</head>
<body>

<header class="encabezado">
    <h1>Calculadora basica con flask</h1>

    <nav class="menu">
        <a href="/suma">Suma</a>
        <a href="/resta">Resta</a>
        <a href="/multiplicacion">Multiolicacion</a>
        <a href="/division">Division</a>
    </nav>
</header>

<main class="contenedor">
    <section class="tarjeta-operacion">
        <h2>Division</h2>
        <form method="POST">
            <label for="numero1">Primer numero</label>
            <input id="numero1" name="numero1"
                    type="number" step="any" required>
            <label for="numero2">Segundo numero</label>
            <input id="numero2" name="numero2"
                    type="number" step="any" required>
            <button class="boton" type="submit">
                Calcular la division
            </button>
        </form>
        {% if resultado is not none %}
            <p class="resultado">
                Resultado: {{resultado}}
            </p>
        {% endif %}
        {% if error %}
            <p class="error">{{error}}</p>
        {% endif %}
    </section>
</main>
</body>
</html>
